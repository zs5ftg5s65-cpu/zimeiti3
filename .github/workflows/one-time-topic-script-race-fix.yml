name: one-time-topic-script-race-fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WarRoom topic-to-script race
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/panels/selfmedia3/WarRoomPanel.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'const script = store.createScriptFromTopic(topic.id, currentDay);'
          new = 'const script = store.createScriptFromTopic(topic, currentDay);'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/panels/selfmedia3/WarRoomPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use newly created topic when generating script'
          git push
