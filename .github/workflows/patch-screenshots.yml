name: Patch Screenshot Import
on:
  push:
    branches: [main]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'patch screenshot import')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing panels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Video thumbnail: use the same browser frame extractor already used for analysis.
          p=Path('src/components/panels/selfmedia3/MediaLibraryPanel.tsx')
          s=p.read_text()
          s=s.replace('const thumb = isImage ? await makeThumbnail(file) : "";', 'const thumb = isImage ? await makeThumbnail(file) : (isVideo ? ((await captureVideoFrames(file, 1)).frames[0]?.dataUrl || "") : "");')
          p.write_text(s)

          # English: show speaking demonstration by default and make the correct answer explicit after submission.
          p=Path('src/components/panels/EnglishDetailPanel.tsx'); s=p.read_text()
          s=s.replace('const [showSamples, setShowSamples] = useState(false);','const [showSamples, setShowSamples] = useState(true);')
          s=s.replace("{showSamples ? '收起参考表达' : '查看更多参考表达'}","{showSamples ? '收起口语示范' : '显示口语示范'}")
          s=s.replace('<span className="font-medium text-foreground">解析：</span>', '<span className="font-medium text-foreground">参考答案：</span>{String.fromCharCode(65 + Number(correctOf(q)))} · <span className="font-medium text-foreground">解析：</span>')
          p.write_text(s)

          # Shared screenshot AI helper.
          Path('src/lib/imageImportAI.ts').write_text('''import { callAI, extractJSON } from "./aiService";\nimport { loadAIConfig } from "./aiConfig";\n\nexport async function fileToDataUrl(file: File): Promise<string> {\n  return await new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = () => resolve(String(reader.result || ""));\n    reader.onerror = () => reject(new Error("图片读取失败"));\n    reader.readAsDataURL(file);\n  });\n}\n\nexport async function extractScreenshotJSON<T>(file: File, instruction: string): Promise<T> {\n  const image = await fileToDataUrl(file);\n  const prompt = `你是数据录入助手。用户上传的是${instruction}的手机截图。只识别截图中真实可见的信息，不确定就返回空字符串或0，禁止猜测。输出严格JSON，不要Markdown。`;\n  const result = await callAI(prompt, loadAIConfig(), [image]);\n  return extractJSON<T>(result.content);\n}\n''')

          def patch_publish(path, header, handler, label):
              p=Path(path); s=p.read_text()
              if 'imageImportAI' not in s:
                  s=s.replace('import { EmptyState } from "./shared";', 'import { EmptyState } from "./shared";\nimport { extractScreenshotJSON } from "@/lib/imageImportAI";')
              if 'ocrBusy' not in s:
                  s=s.replace('const [draft, setDraft] = useState<Partial<PublishRecord>>({});','const [draft, setDraft] = useState<Partial<PublishRecord>>({});\n  const [ocrBusy, setOcrBusy] = useState(false);')
              if 'importPublishScreenshot' not in s:
                  s=s.replace('  const startEdit = (p: PublishRecord) => { setEditingId(p.id); setDraft({ ...p }); };', handler)
              s=s.replace(header, header+'\n        <label className="text-xs border rounded-md px-2 py-1.5 cursor-pointer"><input type="file" accept="image/*" className="hidden" disabled={ocrBusy} onChange={(e) => { const f=e.target.files?.[0]; if(f) void importPublishScreenshot(f); e.currentTarget.value=""; }} />{ocrBusy ? "识别中…" : "📷 截图自动录入"}</label>')
              p.write_text(s)

          publish_handler='''  const startEdit = (p: PublishRecord) => { setEditingId(p.id); setDraft({ ...p }); };\n\n  const importPublishScreenshot = async (file: File) => {\n    setOcrBusy(true);\n    try {\n      const d = await extractScreenshotJSON<Record<string, unknown>>(file, "抖音/视频号/小红书发布页面");\n      setDraft(prev => ({ ...prev, title:String(d.title || prev.title || ""), publishDate:String(d.publishDate || prev.publishDate || ""), publishTime:String(d.publishTime || prev.publishTime || ""), copywriting:String(d.copywriting || prev.copywriting || ""), cta:String(d.cta || prev.cta || ""), hashtags:Array.isArray(d.hashtags) ? d.hashtags.map(String) : prev.hashtags }));\n      if (!editingId) { const p=store.addPublish({videoId:uid("vid"),title:"",platform:"抖音",publishDate:new Date().toISOString().slice(0,10),publishTime:"18:00",videoType:"老板娘口播",duration:"",copywriting:"",hashtags:[],cta:"",status:"待发布",createdAt:Date.now()}); setEditingId(p.id); }\n      toast.success("截图已识别，保存前请核对");\n    } catch(e) { toast.error(e instanceof Error ? e.message : "截图识别失败"); } finally { setOcrBusy(false); }\n  };'''
          patch_publish('src/components/panels/selfmedia3/PublishPanel.tsx','<h3 className="text-sm font-medium flex items-center gap-1.5"><Send className="size-4" />发布管理（{filtered.length}）</h3>',publish_handler,'📷 截图自动录入')

          p=Path('src/components/panels/selfmedia3/AnalyticsPanel.tsx'); s=p.read_text()
          s=s.replace('import { QuickNumberInput, EmptyState } from "./shared";','import { QuickNumberInput, EmptyState } from "./shared";\nimport { extractScreenshotJSON } from "@/lib/imageImportAI";')
          s=s.replace('const [draft, setDraft] = useState<Partial<VideoAnalytics>>({});','const [draft, setDraft] = useState<Partial<VideoAnalytics>>({});\n  const [ocrBusy, setOcrBusy] = useState(false);')
          if 'importAnalyticsScreenshot' not in s:
              s=s.replace('  const startEdit = (a: VideoAnalytics) => { setEditingId(a.id); setDraft({ ...a }); };', '''  const startEdit = (a: VideoAnalytics) => { setEditingId(a.id); setDraft({ ...a }); };\n\n  const importAnalyticsScreenshot = async (file: File) => {\n    setOcrBusy(true);\n    try {\n      const d = await extractScreenshotJSON<Record<string, unknown>>(file, "短视频平台数据详情页");\n      const n=(k:string)=>Number(d[k] ?? 0) || 0;\n      setDraft(prev=>({...prev,title:String(d.title||prev.title||""),views:n("views"),likes:n("likes"),comments:n("comments"),favorites:n("favorites"),shares:n("shares"),newFollowers:n("newFollowers"),privateMessages:n("privateMessages"),storeVisits:n("storeVisits"),groupPurchases:n("groupPurchases"),dropOff2s:n("dropOff2s"),retention5s:n("retention5s"),completionRate:n("completionRate"),adSpend:n("adSpend"),adViews:n("adViews"),adConversions:n("adConversions")}));\n      toast.success("数据截图已识别，保存前请核对");\n    } catch(e) { toast.error(e instanceof Error ? e.message : "截图识别失败"); } finally { setOcrBusy(false); }\n  };''')
          s=s.replace('<h3 className="text-sm font-medium flex items-center gap-1.5"><BarChart3 className="size-4" />数据诊断（{filtered.length}）</h3>','<h3 className="text-sm font-medium flex items-center gap-1.5"><BarChart3 className="size-4" />数据诊断（{filtered.length}）</h3>\n        <label className="text-xs border rounded-md px-2 py-1.5 cursor-pointer"><input type="file" accept="image/*" className="hidden" disabled={ocrBusy} onChange={(e)=>{const f=e.target.files?.[0];if(f){if(!editingId) startNew();setTimeout(()=>void importAnalyticsScreenshot(f),0)}e.currentTarget.value=""}} />{ocrBusy?"识别中…":"📷 截图自动录入"}</label>')
          p.write_text(s)

          p=Path('src/components/panels/selfmedia3/ReviewPanel.tsx'); s=p.read_text()
          s=s.replace('import { buildReviewPrompt } from "./aiPrompts";','import { buildReviewPrompt } from "./aiPrompts";\nimport { fileToDataUrl } from "@/lib/imageImportAI";\nimport { callAI, extractJSON } from "@/lib/aiService";\nimport { loadAIConfig } from "@/lib/aiConfig";')
          s=s.replace('const [draft, setDraft] = useState<Partial<Review>>({});','const [draft, setDraft] = useState<Partial<Review>>({});\n  const [aiBusy, setAiBusy] = useState(false);')
          if 'aiReviewFromScreenshot' not in s:
              s=s.replace('  const startEdit = (r: Review) => { setEditingId(r.id); setDraft({ ...r }); };', '''  const startEdit = (r: Review) => { setEditingId(r.id); setDraft({ ...r }); };\n\n  const aiReviewFromScreenshot = async (file: File) => {\n    setAiBusy(true);\n    try {\n      const image=await fileToDataUrl(file);\n      const result=await callAI("请读取这张短视频数据截图，并基于截图真实可见数据直接生成AI复盘。只输出严格JSON，字段：openingProblem,retentionProblem,topicProblem,contentProblem,personProblem,conversionProblem,biggestProblem,evidence,mustChange,keepUnchanged,isHighPerforming。看不到的信息不要猜。",loadAIConfig(),[image]);\n      const d=extractJSON<Record<string,unknown>>(result.content);\n      const existing=store.reviews.find(r=>r.id===editingId);\n      const target=existing || store.addReview({...EMPTY,createdAt:Date.now(),isManual:false});\n      if(!existing) setEditingId(target.id);\n      const patch=Object.fromEntries(Object.keys(EMPTY).map(k=>[k,k==='isHighPerforming'?Boolean(d[k]):String(d[k]??"")])) as Partial<Review>;\n      patch.isManual=false; store.updateReview(target.id,patch); setDraft({...target,...patch}); toast.success("截图已识别并完成AI复盘");\n    } catch(e) { toast.error(e instanceof Error?e.message:"AI复盘失败"); } finally { setAiBusy(false); }\n  };''')
          s=s.replace('<h3 className="text-sm font-medium flex items-center gap-1.5"><Target className="size-4" />AI复盘（{filtered.length}）</h3>','<h3 className="text-sm font-medium flex items-center gap-1.5"><Target className="size-4" />AI复盘（{filtered.length}）</h3>\n        <label className="text-xs border rounded-md px-2 py-1.5 cursor-pointer"><input type="file" accept="image/*" className="hidden" disabled={aiBusy} onChange={(e)=>{const f=e.target.files?.[0];if(f)void aiReviewFromScreenshot(f);e.currentTarget.value=""}} />{aiBusy?"AI分析中…":"📷 上传截图自动复盘"}</label>')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src && git commit -m "fix: patch screenshot import" && git push
      - name: Remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/patch-screenshots.yml
          git add .github/workflows/patch-screenshots.yml
          git commit -m "chore: remove one-time screenshot workflow" || true
          git push || true
